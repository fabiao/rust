name: Sync fork and mirror to GitLab

on:
  workflow_dispatch:

jobs:
  sync-and-mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo sync "${{ github.repository }}" \
            --branch main
      
      - name: Refresh local main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Mirror main to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
        run: |
          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_REPOSITORY}.git"

          git push gitlab refs/heads/main:refs/heads/main
