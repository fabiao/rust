[package]
name = "asksource"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "cargo-asksource"
path = "src/main.rs"
test = false
doctest = false

[features]
snapshot-driver = []

[dependencies]
cargo = { path = "../cargo" }
cargo-util = { path = "../cargo/crates/cargo-util" }
color-print = "0.3.7"
hex = "0.4.3"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde_json = "1"
sha2 = "=0.11"
syn = { version = "3", features = ["full", "visit"] }

[workspace]
resolver = "2"
